name: Paper bot continuity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          PAPER_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/postgres
