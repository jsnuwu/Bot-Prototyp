services:
  - type: web
    name: solana-paper-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TRADING_MODE
        value: paper
      - key: JUPITER_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
